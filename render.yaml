# =============================================================================
# RENDER BLUEPRINT — deploys database + backend + frontend together
# =============================================================================
databases:
  - name: portfolio-db
    databaseName: portfolio_db
    user: portfolio_user
    plan: free

services:
  # -----------------------------------------------------------------------
  # BACKEND — Django REST API
  # -----------------------------------------------------------------------
  - type: web
    name: portfolio-backend
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DB_NAME
        value: portfolio_db
      - key: DB_USER
        value: portfolio_user
      - key: DB_PASSWORD
        fromDatabase:
          name: portfolio-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: portfolio-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: portfolio-db
          property: port
      - key: ALLOWED_HOSTS
        value: portfolio-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://portfolio-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://portfolio-frontend.onrender.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: ADMIN_EMAIL
        value: kevin@kevinmanoti.dev

  # -----------------------------------------------------------------------
  # FRONTEND — React built as static site
  # -----------------------------------------------------------------------
  - type: web
    name: portfolio-frontend
    plan: free
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://portfolio-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html